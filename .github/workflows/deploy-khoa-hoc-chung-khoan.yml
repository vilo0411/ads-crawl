name: Deploy khoa-hoc-chung-khoan report

on:
  push:
    branches: [main]
    paths: ["projects/khoa-hoc-chung-khoan/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          # pages/ là cache JSON thô của scraper, không cần trên web
          rsync -a --exclude '.DS_Store' --exclude 'pages/' projects/khoa-hoc-chung-khoan/ site/
          # mindmap.html viết theo định dạng Artifact (không có <html>/<head>): bọc thêm khung trang
          { printf '<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>\n'
            cat projects/khoa-hoc-chung-khoan/mindmap.html
            printf '\n</body></html>\n'; } > site/mindmap.html

      - name: Deploy to Cloudflare Pages
        run: npx -y wrangler@4 pages deploy site --project-name khoa-hoc-chung-khoan-report --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
