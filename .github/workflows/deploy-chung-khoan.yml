name: Deploy chung-khoan report

on:
  push:
    branches: [main]
    paths: ["projects/chung-khoan/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only pull this project's LFS videos to save LFS bandwidth
      - run: git lfs pull --include "projects/chung-khoan/**"

      - name: Build site
        run: rsync -a --exclude '.DS_Store' --exclude '_thu_cong_*' projects/chung-khoan/ site/

      - name: Deploy to Cloudflare Pages
        run: npx -y wrangler@4 pages deploy site --project-name chung-khoan-report --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
